<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Invoice Pipeline{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen bg-base-200">
  <!-- Top bar: brand + badge + reset -->
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="text-xl font-bold tracking-tight">Invoice Pipeline</a>
    </div>
    <div class="flex-none flex items-center gap-3">
      <span class="badge badge-outline badge-sm">Acme Corp</span>
      <div class="divider divider-horizontal mx-0"></div>
      <button
        class="btn btn-outline btn-error btn-xs"
        hx-post="/api/reset-database"
        hx-swap="none"
        hx-confirm="Reset all tables to seed state? This will clear all processed invoices, review queue items, and reset inventory stock."
        hx-on::after-request="window.location.reload()"
      >
        Reset DB
      </button>
    </div>
  </div>

  <!-- Navigation tabs -->
  <div class="bg-base-100 border-b border-base-300">
    <div class="container mx-auto max-w-7xl px-4">
      <nav class="flex gap-1">
        {% set nav_items = [
          ('/', 'Dashboard'),
          ('/review-queue', 'Review Queue'),
          ('/processed', 'Processed'),
          ('/vendors', 'Vendors'),
        ] %}
        {% for href, label in nav_items %}
        <a
          href="{{ href }}"
          class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors
            {% if current_path is defined and current_path == href %}
              border-primary text-primary
            {% else %}
              border-transparent text-base-content/60 hover:text-base-content hover:border-base-300
            {% endif %}"
        >
          {{ label }}
        </a>
        {% endfor %}
      </nav>
    </div>
  </div>

  <main class="container mx-auto px-4 py-6 max-w-7xl">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
