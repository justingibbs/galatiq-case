<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Invoice Pipeline{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen bg-base-200">
  <!-- Top bar -->
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="text-xl font-bold tracking-tight">Invoice Pipeline</a>
    </div>
    <div class="flex-none flex items-center gap-3">
      <span class="badge badge-outline badge-sm">Acme Corp</span>
      <div class="divider divider-horizontal mx-0"></div>
      <a href="/settings/vendors" class="btn btn-ghost btn-xs" title="Vendor Settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Vendors
      </a>
      <button
        class="btn btn-outline btn-error btn-xs"
        hx-post="/api/reset-database"
        hx-swap="none"
        hx-confirm="Reset all tables to seed state? This will clear all processed invoices, review queue items, and reset inventory stock."
        hx-on::after-request="window.location.href='/'"
      >
        Reset DB
      </button>
    </div>
  </div>

  <!-- Wizard stepper -->
  {% if wizard_step is defined %}
  <div class="bg-base-100 border-b border-base-300">
    <div class="container mx-auto max-w-4xl px-4 py-4">
      <ul class="steps steps-horizontal w-full">
        <li class="step{% if wizard_step >= 1 %} step-primary{% endif %}">
          <span class="{% if wizard_step == 1 %}font-bold{% endif %}">Import</span>
        </li>
        <li class="step{% if wizard_step >= 2 %} step-primary{% endif %}">
          <span class="{% if wizard_step == 2 %}font-bold{% endif %}">Match & Review</span>
        </li>
        <li class="step{% if wizard_step >= 3 %} step-primary{% endif %}">
          <span class="{% if wizard_step == 3 %}font-bold{% endif %}">Approve & Fulfill</span>
        </li>
        <li class="step{% if wizard_step >= 4 %} step-primary{% endif %}">
          <span class="{% if wizard_step == 4 %}font-bold{% endif %}">Done</span>
        </li>
      </ul>
    </div>
  </div>
  {% endif %}

  <main class="container mx-auto px-4 py-6 max-w-7xl">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
