{% extends "base.html" %}

{% block title %}Dashboard — Invoice Pipeline{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold">Invoice Dashboard</h1>
    <p class="text-base-content/60 mt-1">{{ invoices|length }} invoices loaded</p>
  </div>
  <div class="flex gap-2">
    <button
      class="btn btn-primary"
      hx-post="/api/invoices/process-all"
      hx-swap="none"
    >
      Process All
    </button>
  </div>
</div>

<div
  id="invoice-grid"
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
  hx-ext="sse"
  sse-connect="/sse/invoices/batch/progress"
>
  {% for invoice in invoices %}
  <div id="card-{{ invoice.invoice_id }}" sse-swap="{{ invoice.invoice_id }}" hx-swap="innerHTML">
    {% include "partials/invoice_card.html" %}
  </div>
  {% endfor %}
</div>
{% endblock %}
