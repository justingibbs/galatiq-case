<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold">Step 1: Import Invoices</h1>
    <p class="text-base-content/60 mt-1">{{ invoices|length }} invoices ready to process</p>
  </div>
  <button
    id="btn-process-batch"
    class="btn btn-primary"
    hx-post="/api/batch/import"
    hx-swap="none"
  >
    Process Batch
  </button>
</div>

<div
  id="import-grid"
  hx-ext="sse"
  sse-connect="/sse/invoices/batch/progress?step=1"
>
  <!-- Batch status summary (updated via SSE) -->
  <div id="batch-status-area" sse-swap="batch-status" hx-swap="innerHTML">
    {% include "partials/batch_status.html" %}
  </div>

  <!-- Invoice rows -->
  <div class="overflow-x-auto mt-4">
    <table class="table table-sm bg-base-100 shadow-sm border border-base-300 rounded-lg">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Format</th>
          <th>Status</th>
          <th>Vendor</th>
          <th class="text-right">Total</th>
        </tr>
      </thead>
      <tbody>
        {% for invoice in invoices %}
        <tr id="row-{{ invoice.invoice_id }}" sse-swap="{{ invoice.invoice_id }}" hx-swap="innerHTML">
          {% include "partials/wizard_import_row.html" %}
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<!-- Continue button -->
<div class="mt-6 flex justify-end">
  <a
    id="btn-continue-step1"
    href="/?step=2"
    class="btn btn-primary {% if summary.pending > 0 or summary.processing > 0 %}btn-disabled{% endif %}"
  >
    Continue to Match & Review
  </a>
</div>
